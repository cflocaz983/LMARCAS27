<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="" method="post">
    <fieldset>
      <legend>Datos personales</legend>
        <label for="nombre">Nombre:</label><input type="text" id="nombre" name="nombre"><br><br>
        <label for="apellido">Apellido:</label><input type="text" id="apellido" name="apellido"><br><br>
        <label for="edad">Edad:</label><input type="number" id="edad" name="edad"><br><br>
        <input type="radio" id="hombre" name="sexo" value="hombre"><label for="hombre">Hombre</label>
        <input type="radio" id="mujer" name="sexo" value="mujer" checked="checked"><label for="mujer">Mujer</label><br><br>
        <input type="checkbox" id="acepto" name="acepto"><label for="acepto">Acepto los términos y condiciones</label><br><br>
        <input type="file" id="foto" name="foto"><br><br>
        <label for="color">Color favorito:</label><input type="color" id="color" name="color"><br><br>
    </fieldset>  
    <fieldset>
        <legend>Datos de contacto</legend>
        <label for="email">Email:</label><input type="email" id="email" name="email"><br><br>
        <label for="telefono">Teléfono:</label><input type="tel" id="telefono" name="telefono"><br><br>
        <label for="pais">País:</label>
        <select id="pais" name="pais">
            <option value="mexico">México</option>
            <option value="espana">España</option>
            <option value="argentina">Argentina</option>
        </select><br><br>
        </fieldset>
        <fieldset>
        <legend>Sistemas Operativos</legend>
        <select id="sistemas" name="sistemas">
            <option value="windows" selected="selected">Windows</option>
            <option value="mac">Mac OS</option>
            <option value="linux">Linux</option>
        </select><br><br>
        </fieldset>
    <input type="submit" value="Enviar"><input type="reset" value="Borrar">
</form>
</body>
</html>
