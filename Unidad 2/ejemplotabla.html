<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table, tr, td{
            border:1px solid black
        }
        .roja{
            background-color: red;
        }
        .amarillo{
            background-color: yellow;
            color:red;
        }
        table{
            width: 50%;
            border-collapse: collapse;
            margin:0 auto;
            text-align: center;
        }
    </style>
</head>
<body>
    <table>
        <tr class="roja">
            <td>1</td>
            <td>2</td>
            <td>3</td>
            <td>4</td>
        </tr>
        <tr class="amarillo">
            <td>5</td>
            <td>6</td>
            <td>7</td>
            <td>8</td>
        </tr>
        <tr>
            <td  class="roja">9</td>
            <td class="amarillo">10</td>
            <td>11</td>
            <td>12</td>
        </tr>
    </table>
</body>
</html>
