<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        ul{
        list-style-type: none;
        background-color: #333;
        display: flex;
        }
       
        li a:link{
        display:block;
        color:white;
         text-align:center;
        text-decoration:none;
          padding:14px 16px;
        }
        li a:visited{
            display:block;
            color:white;
            text-align:center;
           

        }
        li a:hover{
            background-color: yellow;
            color:blue;
            border-radius: 10px;
            font-weight: bold;
            font-size: 20px;
        }
        p a:link{
            color:rgb(132, 8, 8);
            text-align:center;
        }
        p a:visited{
            color:rgb(132, 8, 8);
            text-align:center;
            text-decoration:none;
        }
        p{
            text-align:center;
           
        }
        </style>
</head>
<body>
    <ul>
        <li><a href="">Inicio</a></li>
        <li><a href="">Acerca de</a></li>
        <li><a href="">Servicios</a></li>
        <li><a href="">Contacto</a></li>
        <li><a href="">Blog</a></li>
    </ul>
    <p><a href="https://www.google.com">Visita Google</a></p>
</body>
</html>
